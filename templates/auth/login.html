{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-card">
    <h1>Login</h1>

    <form method="POST">
        {{ form.hidden_tag() }}

        {{ form.email.label }}
        {{ form.email }}

        {{ form.password.label }}
        {{ form.password }}

        <button type="submit">Login</button>
    </form>
</div>

{% endblock %}
